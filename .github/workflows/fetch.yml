name: fetch-and-verify

on:
  schedule:
    - cron: "7 * * * *"       # hourly at minute :07
  workflow_dispatch: {}        # manual trigger
  # push triggers are intentionally excluded (commit loop protection)

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: raise open-file limit
        run: ulimit -n 8192 || true

      - name: fetch, verify, write lists
        run: python3 scripts/fetch_update.py

      - name: commit fresh lists
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A proxies README.md
          if git diff --cached --quiet; then
            echo "nothing new — skipping commit"
          else
            git commit -qm "refresh verified proxies $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git push
          fi
